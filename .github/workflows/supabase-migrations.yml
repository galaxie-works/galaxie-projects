name: Banco (Supabase)

# Toda migration nova em supabase/migrations entra no banco sozinha quando o
# PR é mergeado na main. Também dá para rodar à mão em Actions → "Banco
# (Supabase)" → Run workflow.
#
# Não roda em pull_request de propósito: o token do Supabase só chega a código
# que já está na main (revisado), nunca a código de um PR.

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrations:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'qtgneigzwngvecuzpjdc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conferir o token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Aplicar migrations
        run: node scripts/aplicar-migrations.mjs
